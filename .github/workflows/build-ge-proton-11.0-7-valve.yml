name: Crash Bandicoot ARM64EC NULL-context test build
run-name: "Crash ARM64EC NULL fix — ${{ github.ref_name }} (${{ github.event_name }})"

# EXPERIMENTAL layer: GE-Proton11-7's own Wine base, ValveSoftware/wine 46b29104
# (bleeding-edge, 2026-09-15), merged onto our proton_11.0-2 layer (Valve dc26e618 +
# the full v7 Android stack), plus the GE-Proton11-7 game-fixes tier. Stamped
# versionName 11.0-7.1-crashnull-arm64ec / versionCode 1 gives this test its own slot, apart from the
# current-base GE 11.0-7 layer. Artifacts only; no release job.
# This fork only builds aarch64/28 (ARM64EC, Android API 28, 16 KB aligned).

# This file is named per layer on purpose: GitHub labels a run with the workflow name
# from the DEFAULT branch's copy of the same path, so a shared build-proton.yml made
# every layer's run read "11.0-1". A distinct path per branch shows the real name.
on:
  push:
    # Self-builds on push to its own branch only: GitHub registers workflow_dispatch
    # only for workflows on the default branch, so a bare dispatch 404s here.
    branches: [ 'codex/crash-arm64ec-null-context' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crash-null-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      matrix:
        arch: [aarch64]
        api_level: [28]
      fail-fast: false

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test ARM64EC context wrapper control flow (host harness)
        run: python3 build-scripts/tests/test_arm64ec_context.py

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386

      - name: Download and extract termuxfs for ${{ matrix.arch }}
        run: |
          mkdir -p $HOME/termuxfs/${{ matrix.arch }}
          cd $HOME/termuxfs/${{ matrix.arch }}
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-${{ matrix.arch }}.tar
          tar -xf termuxfs-${{ matrix.arch }}.tar
          ls -la $HOME/termuxfs/${{ matrix.arch }}/

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen
        run: |
          bash build-scripts/build-step0-autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      # ccache — caches compiled objects across runs (per-arch AND per-api_level, so the
      # 4KB-page and 16KB-page object sets never collide). Exact key (per-commit) = full
      # warm restore on a re-run of the same commit; restore-keys pull the newest prior
      # cache for the same arch+api so an unchanged-source rebuild is near-instant. ccache
      # self-validates staleness, so a rolling restore is safe.
      - name: Cache ccache (${{ matrix.arch }} / sdk${{ matrix.api_level }})
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-${{ matrix.arch }}-${{ matrix.api_level }}-${{ github.sha }}
          restore-keys: |
            ccache-p11-${{ matrix.arch }}-${{ matrix.api_level }}-

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: |
          bash build-scripts/build-step0.sh

      - name: Build sysvshm library for ${{ matrix.arch }}
        if: matrix.arch == 'aarch64'
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --build-sysvshm
          else
            bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          fi

      - name: Configure build for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG=""
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --configure
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --configure
          fi

      - name: Build Proton for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG=""
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --build
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --build
          fi

      - name: ccache stats (${{ matrix.arch }} / sdk${{ matrix.api_level }})
        if: always()
        run: ccache -s || true

      - name: Install Proton for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG=""
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --install
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --install
          fi

      # Binary verification of the installed tree BEFORE packaging: refuses a layer that
      # compiled fine but lost a feature (patch dropped, #ifdef'd out, wrong API level,
      # wrong page alignment, skeleton tree from a failed make). See verify-layer.py.
      - name: Verify layer binaries for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"
          fi
          # Every leg compiles against the android28 NDK target (true sdk28); the api_level 35
          # leg only adds 16 KB linker alignment (mirrors PAGES_FLAG in the build-step scripts).
          PAGES=4k; API=28
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES=16k
          GE=""; [ -d android/ge-patches/game-fixes ] && GE="--ge"
          python3 build-scripts/verify-layer.py "$OUTPUT_DIR" --arch ${{ matrix.arch }} --api $API --pages $PAGES $GE

      - name: Download prefixPack.txz for ${{ matrix.arch }}
        run: |
          # Pinned to GameNative/bionic-prefix-files @ 6286ac45 (2026-05-07, the files every
          # shipped layer was built with) and sha256-checked: a push to their `main` must never
          # change what our layer ships, and a truncated download must never be packaged.
          PIN=6286ac456e4a8376e053ce1ce4f565bd37cc4af4
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            NAME=prefixPack-x86_64-11.txz
            SHA=d8d1d8af905af40ae7f37114de1cf87575f88827fd8e2780cd2f92d7852a8ed0
          else
            NAME=prefixPack-arm64ec-11.txz
            SHA=ade99dc80b17086a269c038c9bc50167902103a9a61df763cba4d613543ff12a
          fi
          wget --tries=5 --retry-connrefused --waitretry=10 "https://raw.githubusercontent.com/GameNative/bionic-prefix-files/$PIN/$NAME" -O $GITHUB_WORKSPACE/prefixPack.txz
          echo "$SHA  $GITHUB_WORKSPACE/prefixPack.txz" | sha256sum -c -

      - name: Generate profile.json files
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
            DESC="GE-Proton 11.0-7.1 ${ARCH_NAME} (bionic, box64) EXPERIMENTAL — GE-Proton11-7's own Valve Wine 46b29104 base (bleeding-edge, 2026-09-15) + our full v7 Android stack: fast-yield gate + esync + xrandr/xrender + XP desktop + xinput controller-dies fix + EA network fixes + realized-font-handle cap 32768 + DirectAudio v1.3.2 + Android fixes (noexec/force_anon SD-card boot, drive-root copy guard, C.UTF-8 locale) + GE-Proton11-7 game-fixes (ai-limit, assettocorsa, black-desert, dai_xinput, eac, maplestory, max-payne, pso2, return-to-krondor, silence-starcitizen, vgsoh, WM_ACTIVATEAPP). Runs x86_64 Wine through box64; Bannerlator/WinNative/Winlator-bionic; needs a fresh x86_64 container."
            DESC_WINE="GE-Proton 11.0-7.1 ${ARCH_NAME} (bionic, box64) EXPERIMENTAL — GE-Proton11-7's Valve Wine 46b29104 base + our full v7 Android stack + GE-Proton11-7 game-fixes. Runs x86_64 Wine through box64; Bannerlator/WinNative/Winlator-bionic; needs a fresh x86_64 container."
          else
            ARCH_NAME="arm64ec"
            DESC="GE-Proton 11.0-7.1 ${ARCH_NAME} (bionic) EXPERIMENTAL — GE-Proton11-7's own Valve Wine 46b29104 base (bleeding-edge, 2026-09-15) + our full v7 Android stack: fast-yield gate + FEX-unixlib loader + esync + xrandr/xrender + XP desktop + xinput controller-dies fix + RtlIsEcCode guard + EA network fixes + realized-font-handle cap 32768 + DirectAudio v1.3.2 + Android fixes (noexec/force_anon SD-card boot, drive-root copy guard, C.UTF-8 locale) + GE-Proton11-7 game-fixes (ai-limit, assettocorsa, black-desert, dai_xinput, eac, maplestory, max-payne, pso2, return-to-krondor, silence-starcitizen, vgsoh, WM_ACTIVATEAPP). Bannerlator/WinNative/Winlator-bionic; needs a fresh arm64ec container."
            DESC_WINE="GE-Proton 11.0-7.1 ${ARCH_NAME} (bionic) EXPERIMENTAL — GE-Proton11-7's Valve Wine 46b29104 base + our full v7 Android stack + GE-Proton11-7 game-fixes. Bannerlator/WinNative/Winlator-bionic; needs a fresh arm64ec container."
          fi

          # Generate Proton profile.json
          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Proton",
            "versionName": "11.0-7.1-crashnull-${ARCH_NAME}",
            "versionCode": 1,
            "description": "Crash Bandicoot NULL-context test build ${GITHUB_SHA}; device validation pending. ${DESC}",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          # Generate Wine profile.json for Ludashi
          cat > $GITHUB_WORKSPACE/profile-wine.json << EOF
          {
            "type": "Wine",
            "versionName": "11.0-7.1-crashnull-${ARCH_NAME}",
            "versionCode": 0,
            "description": "Crash Bandicoot NULL-context test build ${GITHUB_SHA}; device validation pending. ${DESC_WINE}",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

      - name: Package build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"
            ARCH_NAME="x86_64"
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"
            ARCH_NAME="arm64ec"
          fi

          cd $OUTPUT_DIR

          # Create Proton WCP - zstd (tar.zst) for fast in-app install. The app's ContentsManager
          # tries XZ then falls back to ZSTD, so a zstd .wcp installs with no app change and decompresses
          # far faster than xz. -T0 = all cores, -19 = high ratio (small download).
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar -I 'zstd -T0 -19' -cf GE-proton-11.0-7.1-crashnull-$ARCH_NAME.wcp bin lib share prefixPack.txz profile.json
          mv GE-proton-11.0-7.1-crashnull-$ARCH_NAME.wcp $GITHUB_WORKSPACE/

          # Create Wine WCP for CMOD & Ludashi - wcp.xz format
          cp $GITHUB_WORKSPACE/profile-wine.json profile.json
          tar cJf proton-wine-11.0-7.1-crashnull-$ARCH_NAME.wcp.xz bin lib share prefixPack.txz profile.json
          mv proton-wine-11.0-7.1-crashnull-$ARCH_NAME.wcp.xz $GITHUB_WORKSPACE/

      # The packaged archive must carry exactly what the app's ContentsManager expects.
      - name: Verify wcp archives
        run: |
          cd $GITHUB_WORKSPACE
          UNIX="${{ matrix.arch }}-unix"
          for WCP in *.wcp; do
            echo "== $WCP ($(stat -c %s "$WCP") bytes)"
            tar -I zstd -tf "$WCP" > wcp.lst
            for e in profile.json prefixPack.txz bin/wine "lib/wine/$UNIX/ntdll.so" "lib/wine/$UNIX/win32u.so" share/wine/wine.inf; do
              grep -qx -- "$e" wcp.lst || { echo "FATAL: $e missing from $WCP"; exit 1; }
            done
            tar -I zstd -xf "$WCP" -O profile.json > wcp-profile.json
            cmp wcp-profile.json profile.json || { echo "FATAL: profile.json inside $WCP differs from the generated one"; exit 1; }
            python3 -c 'import json,sys; p=json.load(open("wcp-profile.json")); print("   type=%s versionName=%s versionCode=%s" % (p["type"], p["versionName"], p["versionCode"]))'
            echo "   $(wc -l < wcp.lst) entries; ok"
          done
          for WCPXZ in *.wcp.xz; do
            echo "== $WCPXZ ($(stat -c %s "$WCPXZ") bytes)"
            tar -tJf "$WCPXZ" | grep -qx profile.json || { echo "FATAL: profile.json missing from $WCPXZ"; exit 1; }
            echo "   ok"
          done

      # Checksums straight from the run, so a wcp can be identified without downloading it.
      - name: Report wcp checksums and profiles (${{ matrix.arch }})
        run: |
          cd $GITHUB_WORKSPACE
          for F in *.wcp *.wcp.xz; do
            [ -f "$F" ] || continue
            if [ "${F%.xz}" != "$F" ]; then
              tar -xJf "$F" -O profile.json > report-profile.json
              N=$(tar -tJf "$F" | wc -l)
            else
              tar -I zstd -xf "$F" -O profile.json > report-profile.json
              N=$(tar -I zstd -tf "$F" | wc -l)
            fi
            echo "== $F"
            echo "   size_bytes=$(stat -c %s "$F")"
            echo "   sha256=$(sha256sum "$F" | cut -d' ' -f1)"
            echo "   entries=$N"
            python3 -c 'import json; p=json.load(open("report-profile.json")); print("   type=%s\n   versionName=%s\n   versionCode=%s\n   description=%s" % (p["type"], p["versionName"], p["versionCode"], p["description"]))'
          done

      - name: Upload build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
          fi
          echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV

      - name: Save build identity and ntdll disassembly
        run: |
          mkdir -p build-evidence
          LLVM="$HOME/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64/bin"
          NTDLL="$HOME/compiled-files-aarch64/lib/wine/aarch64-windows/ntdll.dll"
          test -s "$NTDLL"
          "$LLVM/llvm-readobj" --file-headers --coff-exports "$NTDLL" > build-evidence/ntdll-exports.txt
          "$LLVM/llvm-objdump" --disassemble --no-show-raw-insn "$NTDLL" > build-evidence/ntdll-disassembly.txt
          cp profile.json build-evidence/profile.json
          sha256sum *.wcp *.wcp.xz > build-evidence/SHA256SUMS
          python3 - <<'PY'
          import json, os, pathlib
          manifest = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "base_commit": "20518b4ce72b463877ad03db4804c0bb9a5e0dfb",
              "fix": "ARM64EC NtGetContextThread: return STATUS_INVALID_PARAMETER for NULL context",
              "historical_fix": "ec418e7f55f5e38f8825187ae5dfe33fec31689b",
              "validation": "Host wrapper control-flow harness; Android cross-build; upstream layer/package checks",
              "device_tested": False,
          }
          pathlib.Path("build-evidence/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: crashnull-build-evidence
          path: build-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Proton build artifacts for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        uses: actions/upload-artifact@v4
        with:
          name: proton-crashnull-${{ env.ARCH_NAME }}-sdk${{ matrix.api_level }}
          path: GE-proton-11.0-7.1-crashnull-${{ env.ARCH_NAME }}.wcp
          if-no-files-found: error
          retention-days: 30

      - name: Upload Wine build artifacts for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        uses: actions/upload-artifact@v4
        with:
          name: proton-wine-crashnull-${{ env.ARCH_NAME }}-sdk${{ matrix.api_level }}
          path: proton-wine-11.0-7.1-crashnull-${{ env.ARCH_NAME }}.wcp.xz
          if-no-files-found: error
          retention-days: 30
